# Argus security scanners (huntridge-labs/argus), adapted from the API repo's workflow.
# Bandit is left out because this repo has no Python.
name: Security Scan (All Scanners)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC

# Read-only by default; jobs that upload SARIF or post PR comments widen this.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast-scanning:
    name: SAST Scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      pull-requests: write # Gitleaks PR comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the full git history.
          fetch-depth: 0
          persist-credentials: false

      # Argus's scanner-opengrep action scans nothing: OpengrepScanner doesn't set
      # container_entrypoint, so the image (ENTRYPOINT ["opengrep"]) runs
      # `opengrep opengrep ...`, aborts with "File not found: opengrep" and reports a
      # clean pass. Run the same digest-pinned image (argus/containers.py at 1.12.7)
      # directly until Argus sets container_entrypoint = "opengrep".
      # -w + "." keeps SARIF paths repo-relative so alerts map to files.
      - name: Run OpenGrep
        env:
          OPENGREP_IMAGE: ghcr.io/huntridge-labs/argus/scanner-opengrep:1.12.7@sha256:11a58311bac55a366f0a858bfdbf02bbf76aef0bf54cd52fef79a8e83a781369
        run: |
          # The image runs as argus (uid 1000); the runner user is uid 1001.
          mkdir -p opengrep-reports
          chmod 777 opengrep-reports
          docker run --rm -v "$PWD:/workspace:ro" -v "$PWD/opengrep-reports:/output" -w /workspace \
            "$OPENGREP_IMAGE" --config auto --sarif --output /output/opengrep.sarif .

      - name: Upload OpenGrep SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: opengrep-reports/opengrep.sarif
          category: opengrep

      - name: Run Gitleaks (Secrets Detection)
        uses: huntridge-labs/argus/.github/actions/scanner-gitleaks@cf54e588e4d5a3dfeb8208394cdd1a0f10174150 # 1.12.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post_pr_comment: 'true'
          enable_code_security: 'true'
          fail_on_severity: 'high'

      # Runs after Gitleaks so a failure here doesn't skip it. Fails only on
      # error-level rules; warnings and notes show as code scanning alerts.
      # OpenGrep's SARIF has no per-result level, so read each rule's default.
      - name: Check OpenGrep results
        run: |
          jq -e '(.runs[0].tool.driver.rules | map({(.id): .defaultConfiguration.level}) | add) as $lv
            | [.runs[].results[] | select((.level // $lv[.ruleId]) == "error")] | length == 0' \
            opengrep-reports/opengrep.sarif > /dev/null \
            || { echo "OpenGrep found error-level results; see the code scanning alerts."; exit 1; }

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No write scopes: Syft uploads no SARIF, and its "Dependency Graph" step
    # only acts on release events. Its PR comment is off; the Security Summary
    # comment already includes the SBOM results.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: huntridge-labs/argus/.github/actions/scanner-syft@cf54e588e4d5a3dfeb8208394cdd1a0f10174150 # 1.12.8
        with:
          scan_path: '.'
          output_format: 'cyclonedx-json'
          enable_code_security: 'true'
          post_pr_comment: 'false'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # download scanner summary artifacts
      pull-requests: write # combined PR comment
    needs:
      - sast-scanning
      - sbom-generation
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all scanner summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scanner-summary-*
          path: scanner-summaries/
        continue-on-error: true

      - name: Generate combined summary
        uses: huntridge-labs/argus/.github/actions/security-summary@cf54e588e4d5a3dfeb8208394cdd1a0f10174150 # 1.12.8
        with:
          post_pr_comment: 'true'
        continue-on-error: true
