# Argus security scanners (huntridge-labs/argus), adapted from the API repo's workflow.
# Bandit is left out because this repo has no Python.
name: Security Scan (All Scanners)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6 AM UTC

# Read-only by default; jobs that upload SARIF or post PR comments widen this.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sast-scanning:
    name: SAST Scanners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      pull-requests: write # Gitleaks PR comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the full git history.
          fetch-depth: 0
          persist-credentials: false

      # Argus maps OpenGrep ERROR to high, so this fails only on error-level rules;
      # warnings and notes show as code scanning alerts.
      - name: Run OpenGrep
        uses: huntridge-labs/argus/.github/actions/scanner-opengrep@7327ba6a386c245dc6624f53db08e0a01b28d0fe # 1.13.0
        with:
          enable_code_security: 'true'
          fail_on_severity: 'high'

      - name: Run Gitleaks (Secrets Detection)
        if: ${{ !cancelled() }} # still scan when OpenGrep fails
        uses: huntridge-labs/argus/.github/actions/scanner-gitleaks@7327ba6a386c245dc6624f53db08e0a01b28d0fe # 1.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          post_pr_comment: 'true'
          enable_code_security: 'true'
          fail_on_severity: 'high'

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No write scopes: Syft uploads no SARIF, and its "Dependency Graph" step
    # only acts on release events. Its PR comment is off; the Security Summary
    # comment already includes the SBOM results.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: huntridge-labs/argus/.github/actions/scanner-syft@7327ba6a386c245dc6624f53db08e0a01b28d0fe # 1.13.0
        with:
          scan_path: '.'
          output_format: 'cyclonedx-json'
          enable_code_security: 'true'
          post_pr_comment: 'false'

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # download scanner summary artifacts
      pull-requests: write # combined PR comment
    needs:
      - sast-scanning
      - sbom-generation
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all scanner summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scanner-summary-*
          path: scanner-summaries/
        continue-on-error: true

      - name: Generate combined summary
        uses: huntridge-labs/argus/.github/actions/security-summary@7327ba6a386c245dc6624f53db08e0a01b28d0fe # 1.13.0
        with:
          post_pr_comment: 'true'
        continue-on-error: true
